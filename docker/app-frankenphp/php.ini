; The official images ship no php.ini at all, so everything this application
; needs beyond the compiled-in defaults belongs here.

expose_php = Off

; Read together with num_threads in the Caddyfile: the worst case is one of
; these per thread, and that product has to fit inside the pod's memory limit.
; At 4 threads this is 1Gi, which is what kubernetes/ask-eddie/app.yaml has to
; allow. Raising either without raising the other is how the pod gets OOMKilled
; mid-answer.
memory_limit = 256M

; FrankenPHP is not the CLI SAPI, so this is enforced -- which is the point.
; Under `artisan serve` the CLI SAPI pinned it to 0, and an upstream that never
; answered held a worker for the life of the pod with nothing to reap it.
;
; It has to sit above what a legitimate answer costs (BAR_ANSWER_TIMEOUT is 60,
; and an answer with consults spends more than one of those) and below the
; ingress's proxy-read-timeout of 300, so the server is what gives up first.
max_execution_time = 120

; An SSE frame should reach the guest when it is produced. Laravel's streamed
; response calls flush() itself, but only after ob_flush() -- and there is
; nothing to flush out of if PHP never buffers in the first place.
output_buffering = Off
implicit_flush = On
zlib.output_compression = Off

; Unlike the artisan serve image, opcache.enable_cli is not load-bearing here:
; this is a web SAPI and opcache.enable is the setting that matters. The files
; never change inside the image, so nothing needs to be stat'd on every request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
