; The official images ship no php.ini at all, so everything this application
; needs beyond the compiled-in defaults belongs here.

expose_php = Off
memory_limit = 512M

; `artisan serve` is the CLI SAPI, so enable_cli is what actually turns opcache
; on for the deployed application -- without it the setting below does nothing.
; The files never change inside the image, so nothing needs to be stat'd on
; every request.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
